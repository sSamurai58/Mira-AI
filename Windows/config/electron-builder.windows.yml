appId: ai.mira.desktop
productName: Mira
copyright: Copyright © Mira
directories:
  output: Windows
  buildResources: Windows/build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - package.json
  - "!**/*.map"
  - "!Windows/**"
  # Native win32 rebuild is done on windows-latest CI. Linux cross-pack
  # skips node-pty binaries — Mira terminal falls back to spawn.
  - "!node_modules/node-pty/build/**"
  - "!node_modules/node-pty/prebuilds/**"
asar: true
npmRebuild: false
nodeGypRebuild: false
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: seed
    to: seed
extraMetadata:
  main: dist-electron/main.js
win:
  target:
    # Plain zip — preferred for Linux→Windows cross-builds (NSIS CRC often
    # fails on real Windows even when the file looks intact).
    - target: zip
      arch:
        - x64
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: Mira-Setup-${version}.${ext}
  icon: Windows/build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Mira
  language: 1049
  include: Windows/nsis/installer.nsh
  license: Windows/nsis/license.txt
  # Wine-cross NSIS can trip Windows CRC; zip target is the reliable path.
  differentialPackage: false
portable:
  artifactName: Mira-Portable-${version}.${ext}
