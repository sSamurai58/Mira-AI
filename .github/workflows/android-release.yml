name: Android Release (only)

# Publishes a signed APK only (no Windows / macOS).
#
# Trigger A — Actions UI / CLI:
#   gh workflow run android-release.yml -f tag=v0.1.36
# Trigger B — push tag (CI token-safe):
#   git tag apk/v0.1.36 && git push origin apk/v0.1.36
#   → builds from main, uploads Mira-0.1.36-android.apk into Release v0.1.36

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload APK into (e.g. v0.1.36)"
        required: true
        type: string
  push:
    tags:
      - "apk/v*"

permissions:
  contents: write

jobs:
  release-android-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve target release tag
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            # refs/tags/apk/v0.1.36 → v0.1.36
            RAW="${GITHUB_REF_NAME}"
            TAG="${RAW#apk/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::Bad target tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Target release: $TAG"

      # Always build from main (signing + Mira icons).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0 platforms;android-36

      - name: Install
        run: npm ci

      - name: Build signed APK
        run: |
          set -euo pipefail
          VER="${{ steps.target.outputs.ver }}"
          npm run build:web
          # icons already committed in android/app/src/main/res/mipmap-*
          # node scripts/android-icons.mjs  # needs Pillow; skip on CI
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"
          mkdir -p ../release-android
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"
          cp "$SRC" "../release-android/Mira-${VER}-android.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            "../release-android/Mira-${VER}-android.apk"
          ls -la ../release-android

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          VER="${{ steps.target.outputs.ver }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$VER" --notes "Android hotfix APK (signed)" --latest=false
          fi
          gh release upload "$TAG" "release-android/Mira-${VER}-android.apk" --clobber
          gh release edit "$TAG" --draft=false || true
          echo "Uploaded Mira-${VER}-android.apk → $TAG"
