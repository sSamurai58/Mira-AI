name: Release

# Tag a commit whose package.json version matches, e.g.:
#   npm version 0.1.0 --no-git-tag-version && git commit -am "release: 0.1.0"
#   git tag v0.1.0 && git push origin main --tags
# Or: Actions → Release → Run workflow

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build + publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: mock
        run: npm run release
