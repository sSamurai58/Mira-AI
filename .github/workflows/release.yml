name: Release

# Installers go to GitHub Releases (not into the main branch tree).
# Cut a release only from main:
#   1) merge develop → main (release PR with version bump)
#   2) git tag vX.Y.Z && git push origin vX.Y.Z
# Or: Actions → Release → Run workflow (select main ref)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows first: electron-updater needs latest.yml + NSIS from windows-latest.
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is reachable from origin/main"
          else
            echo "::error::Tag/commit $GITHUB_SHA is not on main. Merge the release into main first, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build + publish Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: mock
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release -- --win --x64

  # macOS: unsigned DMG/ZIP (no Apple Developer cert in CI yet).
  # Users may need right-click → Open the first time (Gatekeeper).
  release-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    needs: release-windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is reachable from origin/main"
          else
            echo "::error::Tag/commit $GITHUB_SHA is not on main. Merge the release into main first, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build + publish macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: mock
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release -- --mac --x64 --arm64
