name: Release

# Tag a commit whose package.json version matches, e.g.:
#   npm version 0.1.0 --no-git-tag-version && git commit -am "release: 0.1.0"
#   git tag v0.1.0 && git push origin main --tags
# Or: Actions → Release → Run workflow

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows first: electron-updater needs latest.yml + NSIS from windows-latest.
  # Linux/mac can be re-enabled later; mixed matrix left incomplete releases.
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build + publish Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: mock
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release -- --win --x64
