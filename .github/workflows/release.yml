name: Release

# Installers go to GitHub Releases (not into the main branch tree).
# Cut a release only from main:
#   1) merge develop → main (release PR with version bump)
#   2) git tag vX.Y.Z && git push origin vX.Y.Z
#
# POLICY: every tagged release publishes Windows AND macOS together
# (same GitHub Release / same tag). Never ship one OS alone.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is reachable from origin/main"
          else
            echo "::error::Tag/commit $GITHUB_SHA is not on main. Merge the release into main first, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build + publish Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: mock
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release -- --win --x64

  # Unsigned DMG/ZIP until Apple Developer cert is wired.
  # First open: right-click → Open (Gatekeeper).
  release-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is reachable from origin/main"
          else
            echo "::error::Tag/commit $GITHUB_SHA is not on main. Merge the release into main first, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build + publish macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: mock
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release -- --mac --x64 --arm64

  # Single gate: release is green only when BOTH platforms published.
  release-all:
    runs-on: ubuntu-latest
    needs: [release-windows, release-macos]
    if: always()
    steps:
      - name: Require Windows + macOS
        shell: bash
        run: |
          set -euo pipefail
          echo "windows=${{ needs.release-windows.result }}"
          echo "macos=${{ needs.release-macos.result }}"
          if [[ "${{ needs.release-windows.result }}" != "success" ]]; then
            echo "::error::Windows release failed — do not treat tag as fully published."
            exit 1
          fi
          if [[ "${{ needs.release-macos.result }}" != "success" ]]; then
            echo "::error::macOS release failed — do not treat tag as fully published."
            exit 1
          fi
          echo "OK: Windows + macOS published to the same GitHub Release."
