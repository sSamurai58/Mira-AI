appId: ai.mira.desktop
productName: Mira
copyright: Copyright © Mira
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  # pdf.js / tesseract assets resolve more reliably outside asar
  - "**/node_modules/pdfjs-dist/**"
  - "**/node_modules/tesseract.js/**"
  - "**/node_modules/tesseract.js-core/**"
# Skip native rebuild so Linux can produce Windows zip; on windows-latest
# CI, node-pty still uses prebuilds / spawn fallback when needed.
npmRebuild: false
nodeGypRebuild: false
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: seed
    to: seed
# Visible next to Mira.exe so install folder is not "only dll trash".
extraFiles:
  - from: build/ЧИТАЙ-МЕНЯ.txt
    to: ЧИТАЙ-МЕНЯ.txt


publish:
  provider: github
  owner: sSamurai58
  repo: Mira-AI
  releaseType: release
linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
win:
  target:
    # Zip is the supported Windows package (no Wine NSIS CRC issues).
    - target: zip
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: Mira-${version}-windows-x64.${ext}
  icon: build/icon.ico
nsis:
  # oneClick + per-user: updates run with /S (no wizard). Assisted multi-page
  # installer was showing "для кого установить" on every quitAndInstall(false).
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Mira
  language: 1049
  include: build/nsis/installer.nsh
  # License only for first interactive install; silent /S updates skip UI.
  license: build/nsis/license.txt
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: build/icon.png
extraMetadata:
  main: dist-electron/main.js
